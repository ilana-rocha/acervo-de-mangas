<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo de Mangás | Contato</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container cabecalho">
            <h1>Acervo de Mangás</h1>
            <p class="subtitulo">Entre em contato</p>
            <nav>
                <a href="index.html">Início</a>
                <a href="catalogo.html">Catálogo</a>
                <a href="sobre.html">Sobre</a>
                <a class="ativo" href="contato.html">Contato</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="pagina-intro">
            <span class="etiqueta">Contato</span>
            <h2>Envie uma mensagem</h2>
        </section>

        <section class="secao contato-box">
            <form id="formContato" class="formulario">
                <div class="campo">
                    <label for="contatoNome">Nome</label>
                    <input type="text" id="contatoNome" required>
                </div>

                <div class="campo">
                    <label for="contatoEmail">E-mail</label>
                    <input type="email" id="contatoEmail" required>
                </div>

                <div class="campo">
                    <label for="contatoMensagem">Mensagem</label>
                    <textarea id="contatoMensagem" rows="6" required></textarea>
                </div>

                <button type="submit">Enviar mensagem</button>
                <p id="mensagemContato" class="mensagem" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>Acervo de Mangás</p>
    </footer>

    <script src="js/contato.js"></script>
</html>
